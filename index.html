<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate Validated - ApexPlanet</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            width: 100%;
            max-width: 620px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            border-top: 6px solid #4CAF50;
            padding: 35px 30px 40px 30px;
            text-align: center;
        }

        /* Logo Styling */
        .logo-wrapper {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .logo-svg {
            width: 72px;
            height: auto;
        }

        .brand-details {
            text-align: left;
        }

        .brand-name {
            font-size: 22px;
            font-weight: 800;
            color: #1a4f8b;
            line-height: 1;
            letter-spacing: -0.5px;
        }

        .brand-sub {
            font-size: 8px;
            font-weight: 700;
            color: #1a4f8b;
            margin-top: 2px;
            letter-spacing: 0.2px;
        }

        /* Heading */
        h1 {
            color: #4CAF50;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 18px;
        }

        /* Text Content - Matched to exact image font scale */
        .content-text {
            color: #333333;
            font-family: 'Georgia', serif;
            font-size: 14.5px;
            line-height: 1.55;
            max-width: 530px;
            margin: 0 auto;
        }

        .content-text strong {
            font-family: Arial, Helvetica, sans-serif;
            font-weight: 700;
            color: #111111;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Exact ApexPlanet Logo & Typography -->
        <div class="logo-wrapper">
            <svg class="logo-svg" viewBox="0 0 160 100" xmlns="http://www.w3.org/2000/svg">
                <!-- Green Wings -->
                <path d="M 10 32 C 25 32, 45 40, 58 54 C 42 46, 25 44, 15 42 Z" fill="#00a887" />
                <path d="M 18 24 C 32 25, 52 35, 68 50 C 50 40, 32 36, 22 34 Z" fill="#00a887" />
                <path d="M 28 16 C 40 18, 58 28, 76 45 C 58 34, 40 28, 30 26 Z" fill="#00a887" />
                
                <!-- Blue Orbit Ring -->
                <ellipse cx="80" cy="52" rx="42" ry="18" fill="none" stroke="#2575fc" stroke-width="4.5" transform="rotate(-32 80 52)" />
                
                <!-- Blue Apex 'A' -->
                <path d="M 52 75 L 75 25 L 94 75 M 60 60 L 88 60" stroke="#1a4f8b" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
            </svg>

            <div class="brand-details">
                <div class="brand-name">ApexPlanet</div>
                <div class="brand-sub">Software Pvt.Ltd</div>
            </div>
        </div>

        <!-- Verification Title -->
        <h1>Certificate Validated</h1>

        <!-- Verification Message -->
        <p class="content-text">
            This certificate is valid. Congratulations, <strong>KANURU SAI PRASANTH</strong>! You have successfully completed the internship in <strong>Web Development with HTML, CSS, and JavaScript</strong> from <strong>10 March, 2026</strong> to <strong>24 April, 2026</strong>.
        </p>
    </div>

</body>
</html>
